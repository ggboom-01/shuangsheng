<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>双生 · 镜像解谜</title>
  <style>
/* 双生 · 界面样式（精装版）
 * 结构与 class / id 名与 index.html 保持一致，仅做视觉升级。
 * 配色：深空 #12121c / 珊瑚 #FF6E5C / 靛蓝 #4F46E5
 * 无外部图片、无外部字体、无第三方库。
 */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #12121c;
  --coral: #FF6E5C;
  --coral-hi: #FFA08F;
  --indigo: #4F46E5;
  --indigo-hi: #7C74F0;
  --text: #E8E6F0;
  --text-dim: #8b88a0;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-hi: rgba(255, 255, 255, 0.11);
  --line: rgba(255, 255, 255, 0.10);
}

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

/* 深空底：两团极淡的极光 */
body::before {
  content: '';
  position: fixed;
  inset: -20%;
  pointer-events: none;
  background:
    radial-gradient(38% 32% at 22% 16%, rgba(255, 110, 92, 0.14), transparent 70%),
    radial-gradient(44% 36% at 80% 84%, rgba(79, 70, 229, 0.18), transparent 72%);
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
}

/* ---------- HUD ---------- */

#hud {
  width: min(92vw, 460px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

#level-name,
#moves,
#timer {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 16px;
  backdrop-filter: blur(6px);
  white-space: nowrap;
}

#level-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--text);
  box-shadow: inset 0 0 18px rgba(79, 70, 229, 0.12);
}

#moves,
#timer {
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 0.5px;
}

#time-count {
  color: var(--indigo-hi);
  font-weight: 700;
  font-size: 16px;
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 12px rgba(124, 116, 240, 0.45);
}

#move-count {
  color: var(--coral);
  font-weight: 700;
  font-size: 17px;
  margin-left: 4px;
  text-shadow: 0 0 12px rgba(255, 110, 92, 0.45);
}

/* ---------- 棋盘 ---------- */

#board-wrap {
  position: relative;
  line-height: 0;
}

canvas {
  display: block;
  border-radius: 20px;
  touch-action: none;
  box-shadow:
    0 10px 44px rgba(79, 70, 229, 0.30),
    0 2px 10px rgba(0, 0, 0, 0.45),
    inset 0 0 0 1px rgba(255, 255, 255, 0.04);
}

/* 滑动方向箭头预览（由 js/input.js 动态创建） */
#swipe-hint {
  position: absolute;
  z-index: 5;
  width: 54px;
  height: 54px;
  margin: -27px 0 0 -27px;
  border-radius: 50%;
  background: rgba(20, 20, 32, 0.55);
  border: 1px solid var(--line);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
  opacity: 0;
  transform: scale(0.85);
  transition: opacity 0.12s ease, transform 0.12s ease;
  pointer-events: none;
}
#swipe-hint.show {
  opacity: 1;
  transform: scale(1);
}
#swipe-hint.active {
  border-color: rgba(255, 110, 92, 0.75);
  box-shadow: 0 0 22px rgba(255, 110, 92, 0.35);
}
#swipe-hint .sh-arrow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 64px;
  height: 64px;
  transform: translate(-50%, -50%) scale(0.62);
}

/* ---------- 虚拟方向键 ---------- */

#dpad {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  grid-template-rows: repeat(3, 54px);
  grid-template-areas:
    ". up ."
    "left . right"
    ". down .";
  gap: 6px;
  justify-content: center;
}

#dpad .dp {
  width: 54px;
  height: 54px;
  padding: 0;
  font-size: 22px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.dp-up { grid-area: up; }
.dp-left { grid-area: left; }
.dp-right { grid-area: right; }
.dp-down { grid-area: down; }

/* ---------- 控制栏 ---------- */

#controls {
  display: flex;
  gap: 10px;
}

button {
  background: var(--glass);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 18px;
  font-size: 14px;
  font-family: inherit;
  letter-spacing: 0.5px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 0.16s ease, transform 0.1s ease, box-shadow 0.16s ease;
}
button:hover {
  background: var(--glass-hi);
  box-shadow: 0 4px 16px rgba(79, 70, 229, 0.22);
}
button:active {
  transform: scale(0.96);
}

.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
}

#btn-next {
  background: linear-gradient(135deg, var(--coral), #f2543f);
  color: #fff;
  border-color: transparent;
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(255, 110, 92, 0.35);
}
#btn-next:hover {
  background: linear-gradient(135deg, var(--coral-hi), var(--coral));
}

button.ghost {
  background: transparent;
}

.hidden {
  display: none !important;
}

/* ---------- 胜利弹层 ---------- */

#win-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 18, 0.74);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  animation: fade 0.22s ease;
}

.win-card {
  position: relative;
  line-height: normal; /* 抵消 #board-wrap 的 line-height: 0，否则多行文本会互相重叠 */
  background: linear-gradient(160deg, #1e1e30, #16161f);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 22px;
  padding: 30px 38px 26px;
  text-align: center;
  box-shadow: 0 18px 64px rgba(79, 70, 229, 0.40);
  animation: pop 0.4s cubic-bezier(0.2, 1.3, 0.4, 1);
}
.win-card::before {
  content: '';
  position: absolute;
  left: 12%;
  right: 12%;
  top: 0;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--coral), var(--indigo-hi), transparent);
  pointer-events: none;
}

.win-card h2 {
  font-size: 27px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--coral), var(--indigo-hi));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 10px;
}
.win-card p {
  color: var(--text-dim);
  margin-bottom: 20px;
  font-size: 15px;
  letter-spacing: 1px;
}
#win-records {
  margin-top: -12px;
  font-size: 12px;
  letter-spacing: 0.5px;
}

@keyframes pop {
  from { transform: scale(0.82); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ---------- 隐私政策门槛（TapTap 合规） ---------- */

#privacy-overlay {
  position: fixed;
  inset: 0;
  z-index: 20; /* 高于胜利弹层(10)与选关面板(11) */
  background: rgba(10, 10, 18, 0.88);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.pv-card {
  background: linear-gradient(160deg, #1e1e30, #16161f);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 22px;
  padding: 28px 26px 24px;
  width: min(86vw, 360px);
  text-align: center;
  box-shadow: 0 18px 60px rgba(79, 70, 229, 0.35);
}

.pv-card h2 {
  font-size: 22px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  background: linear-gradient(90deg, var(--coral), var(--indigo-hi));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.pv-text {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 14px;
}

/* 链接按钮：点击区域 ≥ 40×40（TapTap 合规要求） */
.pv-link {
  display: inline-block;
  min-width: 40px;
  min-height: 40px;
  line-height: 40px;
  padding: 0 18px;
  margin-bottom: 16px;
  color: var(--indigo-hi);
  text-decoration: underline;
  text-underline-offset: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 14px;
  letter-spacing: 1px;
}

.pv-tip {
  color: var(--text-dim);
  font-size: 12px;
  margin-top: 12px;
}

/* ---------- 选关面板 ---------- */

#level-select {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 18, 0.74);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 11;
  animation: fade 0.22s ease;
}

.ls-card {
  background: linear-gradient(160deg, #1e1e30, #16161f);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 22px;
  padding: 22px 20px 18px;
  width: min(88vw, 380px);
  text-align: center;
  box-shadow: 0 18px 60px rgba(79, 70, 229, 0.35);
  animation: pop 0.32s cubic-bezier(0.2, 1.3, 0.4, 1);
}
.ls-card h3 {
  margin-bottom: 14px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-dim);
}

#ls-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-height: 52vh;
  overflow-y: auto;
  margin-bottom: 14px;
  padding: 2px;
}
#ls-buttons button {
  padding: 11px 8px;
  font-size: 14px;
  border-radius: 12px;
}
#ls-buttons button .ls-meta {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}

#btn-ls-close {
  width: 100%;
}

/* 小屏微调 */
@media (max-height: 640px) {
  #app { gap: 10px; }
  #level-name, #moves, #timer { padding: 5px 13px; }
  button { padding: 9px 15px; font-size: 13px; }
  #dpad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
  #dpad .dp { width: 46px; height: 46px; }
}

@media (max-width: 400px) {
  #hud { gap: 6px; }
  #level-name, #moves, #timer { padding: 5px 10px; font-size: 12px; }
  #level-name { font-size: 13px; }
  #time-count { font-size: 14px; }
}

</style>
</head>
<body>
  <div id="privacy-overlay">
    <div class="pv-card">
      <h2>双生 · 镜像解谜</h2>
      <p class="pv-text">本游戏为免费单机游戏，不收集任何个人信息，游戏进度仅保存在本设备浏览器中。开始前请阅读《隐私政策》。</p>

  <div id="app">

  </div>

  <script>
/* 双生 · 核心引擎
 * 规则：
 *  - 本体朝 dir 走一格，影子同时朝相反方向走一格。
 *  - 本体或影子任一方新位置越界/碰墙 → 整步无效，双方不动。
 *  - 本体踩上珊瑚目标且影子同时踩上对角靛蓝目标 → 过关。
 * UMD 导出：浏览器挂 window.Engine，Node 可 require 供工具使用。
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DIRS = {
    up:    { dr: -1, dc:  0 },
    down:  { dr:  1, dc:  0 },
    left:  { dr:  0, dc: -1 },
    right: { dr:  0, dc:  1 },
  };

  // 影子走反方向：本体的位移向量取反
  function mirrorPos(pos, n) {
    return { r: n - 1 - pos.r, c: n - 1 - pos.c };
  }

  class Engine {
    constructor(level) {
      this.level = level;
      this.reset();
    }

    reset() {
      this.player = { r: this.level.player.r, c: this.level.player.c };
      this.shadow = { r: this.level.shadow.r, c: this.level.shadow.c };
      this.moves = 0;
      this.won = false;
      this.history = []; // 每次移动前的 [player, shadow] 快照，供悔棋
    }

    get size() { return this.level.size; }

    // 靛蓝目标：珊瑚目标的对角
    get goalShadow() { return mirrorPos(this.level.goal, this.size); }

    inBounds(p) {
      return p.r >= 0 && p.r < this.size && p.c >= 0 && p.c < this.size;
    }

    isWallA(p) { // 挡本体
      return this.level.wallsA.some(w => w.r === p.r && w.c === p.c);
    }

    isWallB(p) { // 挡影子
      return this.level.wallsB.some(w => w.r === p.r && w.c === p.c);
    }

    tryMove(dir) {
      if (this.won) return { ok: false, won: true };
      const d = DIRS[dir];
      if (!d) return { ok: false, reason: 'invalid-dir' };

      const np = { r: this.player.r + d.dr, c: this.player.c + d.dc };
      const ns = { r: this.shadow.r - d.dr, c: this.shadow.c - d.dc }; // 影子反方向

      if (!this.inBounds(np) || this.isWallA(np)) return { ok: false, reason: 'blocked' };
      if (!this.inBounds(ns) || this.isWallB(ns)) return { ok: false, reason: 'blocked' };

      this.history.push([
        { r: this.player.r, c: this.player.c },
        { r: this.shadow.r, c: this.shadow.c },
      ]);
      this.player = np;
      this.shadow = ns;
      this.moves++;

      const g = this.level.goal;
      const gs = this.goalShadow;
      this.won = (np.r === g.r && np.c === g.c) && (ns.r === gs.r && ns.c === gs.c);
      return { ok: true, won: this.won, moves: this.moves };
    }

    undo() {
      const last = this.history.pop();
      if (!last) return false;
      this.player = last[0];
      this.shadow = last[1];
      this.moves--;
      this.won = false;
      return true;
    }

    getState() {
      return {
        player: { r: this.player.r, c: this.player.c },
        shadow: { r: this.shadow.r, c: this.shadow.c },
        moves: this.moves,
        won: this.won,
      };
    }
  }

  Engine.DIRS = DIRS;
  Engine.mirrorPos = mirrorPos;
  return Engine;
});

</script>
  <script>
/* 双生 · 地狱难度关卡（100 关，v6b 诱导路径生成器）
 * 设计原理：本体与影子镜像刚性锁定 → 等价单令牌迷宫；
 * 关卡 = 网格最长诱导路径（无捷径）+ 岔枝死胡同 + 环路诱饵。
 * 棋盘看起来空旷，最短解却是藏起来的超长诱导路径，每个路口都有假岔路。
 * goal 为珊瑚目标；靛蓝目标固定位于对角 (size-1-r, size-1-c)。
 * wallsA 只挡本体，wallsB 只挡影子。par = BFS 最短步数。
 * 校验：node tools/analyze.js levels_hell.js
 * 难度曲线（指数攀升）：48 → 67 → 69 → 71 → 92 → 97 → 115 → 124（9~15格天花板）
 *   第 9 关起每关 +4.7 步（难度 ≈ ×59/关），至第 100 关 ~556 步（43~45 格）
 */
const LEVELS = [

  <script>
/* 双生 · 渲染器（精装版）
 * 接口（与 GAME_SPEC.md 第 5 节一致，不得变更）：
 *   Renderer.init(canvas)          // 初始化 + DPR 适配 + 尺寸自适应
 *   Renderer.render(state, anim)   // 每帧调用

 * anim:  null | { t: 0~1, fromPlayer, toPlayer, fromShadow, toShadow }
 *
 * 视觉规范（GAME_SPEC.md 第 6 节）：深空 #12121c / 珊瑚 #FF6E5C / 靛蓝 #4F46E5
 * 纯 Canvas 2D 绘制：无外部图片、无外部字体、无第三方库。
 */
const Renderer = (function () {
  'use strict';

  const C = {
    bg: '#12121c',
    coral: '#FF6E5C',
    coralHi: '#FFA08F',
    indigo: '#4F46E5',
    indigoHi: '#7C74F0',
    gridLine: 'rgba(255,255,255,0.06)',
  };

  const TAU = Math.PI * 2;
  const ECHO_LIFE = 520;   // 落位残影寿命（ms）
  const TRAIL_GHOSTS = 3;  // 移动途中拖尾残像数量

  let canvas = null;
  let ctx = null;
  let dpr = 1;
  let cssSize = 0;   // 画布 CSS 边长
  let pad = 0;       // 棋盘外边距
  let cell = 0;      // 单格边长
  let gridN = 5;     // 当前网格数（供 init 计算用）
  let echoes = [];   // 残影 { r, c, color, hi, born }
  let lastAnim = null;
  let resizeBound = false;

  /* ---------- 基础工具 ---------- */

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function easeOut(t) { const u = 1 - clamp01(t); return 1 - u * u * u; }

  }
  function hexA(hex, a) {

      parseInt(h.slice(4, 6), 16) + ',' + a + ')';

  function rrPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();

  /* ---------- 尺寸 ---------- */

  function layout() {

    const vw = window.innerWidth || 360;
    const vh = window.innerHeight || 640;
    cssSize = Math.max(240, Math.min(vw * 0.92, vh * 0.62, 460));
    canvas.style.width = cssSize + 'px';
    canvas.style.height = cssSize + 'px';
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);

  function init(cv) {

      window.addEventListener('resize', relayout);
      window.addEventListener('orientationchange', relayout);

    return cssSize;
  }

  /* ---------- 图层 1：棋盘面板 ---------- */

  function drawPanel() {
    const r = Math.max(16, cssSize * 0.045);
    const g = ctx.createLinearGradient(0, 0, cssSize * 0.35, cssSize);
    g.addColorStop(0, '#1d1d2d');
    g.addColorStop(0.55, '#15151f');
    g.addColorStop(1, '#0e0e16');
    ctx.save();
    ctx.shadowColor = 'rgba(79,70,229,0.32)';
    ctx.shadowBlur = cssSize * 0.09;
    ctx.shadowOffsetY = cssSize * 0.015;

    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    rrPath(0.5, 0.5, cssSize - 1, cssSize - 1, r);
    ctx.stroke();

  /* ---------- 图层 2：格子（圆角 + 微渐变） ---------- */

  function drawCells(n) {
    const inset = cell * 0.055;
    const w = cell - inset * 2;
    const r = cell * 0.17;
    const top = pad, bottom = pad + n * cell;
    const gA = ctx.createLinearGradient(0, top, 0, bottom);
    gA.addColorStop(0, 'rgba(255,255,255,0.062)');
    gA.addColorStop(1, 'rgba(255,255,255,0.024)');
    const gB = ctx.createLinearGradient(0, top, 0, bottom);
    gB.addColorStop(0, 'rgba(255,255,255,0.034)');
    gB.addColorStop(1, 'rgba(255,255,255,0.010)');
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        ctx.fillStyle = ((i + j) % 2 === 0) ? gA : gB;

  /* ---------- 图层 3：网格线 ---------- */

  function drawGridLines(n) {
    ctx.save();
    ctx.strokeStyle = C.gridLine;
    ctx.lineWidth = 1;
    const x0 = pad, x1 = pad + n * cell;
    for (let i = 1; i < n; i++) {
      const p = pad + i * cell;
      ctx.beginPath(); ctx.moveTo(x0, p); ctx.lineTo(x1, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, x0); ctx.lineTo(p, x1); ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    rrPath(x0, x0, n * cell, n * cell, cell * 0.17);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 图层 4：镜像轴（两目标连线，极淡，强化对称感） ---------- */

  function drawMirrorAxis(goal, goalS) {
    const a = centerOf(goal.r, goal.c);
    const b = centerOf(goalS.r, goalS.c);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.055)';
    ctx.lineWidth = Math.max(1, cell * 0.02);
    ctx.setLineDash([cell * 0.14, cell * 0.22]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 图层 5：墙（珊瑚系挡本体 / 靛蓝系挡影子） ---------- */

  function drawWall(w, color, hi) {
    const inset = cell * 0.10;
    const x = pad + w.c * cell + inset;
    const y = pad + w.r * cell + inset;
    const s = cell - inset * 2;
    const r = cell * 0.13;
    const g = ctx.createLinearGradient(x, y, x + s, y + s);
    g.addColorStop(0, hexA(hi, 0.30));
    g.addColorStop(1, hexA(color, 0.15));
    ctx.fillStyle = g;
    rrPath(x, y, s, s, r);
    ctx.fill();
    ctx.save();
    rrPath(x, y, s, s, r);
    ctx.clip();
    ctx.strokeStyle = hexA(color, 0.34);
    ctx.lineWidth = Math.max(1, cell * 0.028);
    for (let k = -s; k < s * 2; k += cell * 0.24) {
      ctx.beginPath();
      ctx.moveTo(x + k, y);
      ctx.lineTo(x + k + s, y + s);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = hexA(color, 0.55);
    ctx.lineWidth = Math.max(1, cell * 0.032);
    rrPath(x, y, s, s, r);
    ctx.stroke();
  }

  function drawWalls(level) {
    (level.wallsA || []).forEach(w => drawWall(w, C.coral, C.coralHi));
    (level.wallsB || []).forEach(w => drawWall(w, C.indigo, C.indigoHi));
  }

  /* ---------- 图层 6：目标（呼吸发光环） ---------- */

  function drawGoal(pos, color, hi, now, won) {
    const p = centerOf(pos.r, pos.c);
    const breathe = 0.5 + 0.5 * Math.sin(now / 520);

    // 柔光晕
    const halo = cell * (won ? 2.0 : 1.15);
    const rg = ctx.createRadialGradient(p.x, p.y, cell * 0.04, p.x, p.y, halo);
    rg.addColorStop(0, hexA(color, won ? 0.5 : 0.26));
    rg.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, halo, 0, TAU);
    ctx.fill();

    // 胜利扩散环
    if (won) {
      const ph = (now % 1200) / 1200;
      ctx.save();
      ctx.strokeStyle = hexA(hi, 0.55 * (1 - ph));
      ctx.lineWidth = Math.max(1.5, cell * 0.06 * (1 - ph));
      ctx.beginPath();
      ctx.arc(p.x, p.y, cell * (0.3 + 0.75 * ph), 0, TAU);
      ctx.stroke();
      ctx.restore();

    // 呼吸环 + 内芯
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = cell * (won ? 0.7 : 0.32);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, cell * (won ? 0.10 : 0.075));
    ctx.beginPath();
    ctx.arc(p.x, p.y, cell * (0.30 + 0.025 * breathe), 0, TAU);
    ctx.stroke();
    ctx.fillStyle = won ? hi : hexA(hi, 0.45 + 0.4 * breathe);
    ctx.beginPath();
    ctx.arc(p.x, p.y, cell * (won ? 0.155 : 0.10 * (0.88 + 0.12 * breathe)), 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- 图层 7：角色（圆角菱形 + 发光） ---------- */

  function drawActor(p, color, hi, alpha, glow, scale) {
    const half = cell * 0.30 * (scale || 1);
    const s = half * Math.SQRT2; // 旋转 45° 后方块边长
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.PI / 4);
    ctx.globalAlpha = alpha;
    if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
    const g = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
    g.addColorStop(0, hi);
    g.addColorStop(1, color);
    ctx.fillStyle = g;
    rrPath(-s / 2, -s / 2, s, s, s * 0.30);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = alpha * 0.92;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    rrPath(-s * 0.17, -s * 0.17, s * 0.34, s * 0.34, s * 0.12);
    ctx.fill();
    ctx.restore();
  }

  // 移动拖尾：沿 from→to 路径留若干个逐渐淡出的残像
  function drawTrail(from, to, t, color, hi, baseAlpha) {
    for (let k = 1; k <= TRAIL_GHOSTS; k++) {
      const tk = t - k * 0.2;
      if (tk <= 0) continue;
      const a = baseAlpha * 0.5 * (1 - k / (TRAIL_GHOSTS + 1));
      drawActor(lerpPos(from, to, tk), color, hi, a, 0, 1 - k * 0.09);

  // 落位残影：一步结束后在起点格留一个缓慢淡出的印记
  function drawEchoes(now) {
    for (let i = 0; i < echoes.length; i++) {
      const e = echoes[i];
      const age = (now - e.born) / ECHO_LIFE;
      if (age >= 1) continue;
      drawActor(centerOf(e.r, e.c), e.color, e.hi, 0.24 * (1 - age), 0, 1 - 0.22 * age);
    }
  }

  /* ---------- 图层 8：暗角 ---------- */

  function drawVignette() {
    const g = ctx.createRadialGradient(
      cssSize / 2, cssSize / 2, cssSize * 0.35,
      cssSize / 2, cssSize / 2, cssSize * 0.78

    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');

    const goalS = state.goalShadowPos ||
      { r: n - 1 - level.goal.r, c: n - 1 - level.goal.c };

    ctx.clearRect(0, 0, cssSize, cssSize);
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, cssSize, cssSize);

    drawPanel();
    drawCells(n);
    drawGridLines(n);
    drawMirrorAxis(level.goal, goalS);
    drawWalls(level);
    drawGoal(level.goal, C.coral, C.coralHi, now, won);
    drawGoal(goalS, C.indigo, C.indigoHi, now, won);

    // 影子（半透明，绘制在本体之下）
    const sp = anim && anim.fromShadow && anim.toShadow
      ? lerpPos(anim.fromShadow, anim.toShadow, anim.t)
      : centerOf(state.shadow.r, state.shadow.c);
    // 本体
    const pp = anim && anim.fromPlayer && anim.toPlayer
      ? lerpPos(anim.fromPlayer, anim.toPlayer, anim.t)
      : centerOf(state.player.r, state.player.c);

    drawEchoes(now);
    if (anim && anim.fromShadow && anim.toShadow) {
      drawTrail(anim.fromShadow, anim.toShadow, anim.t, C.indigo, C.indigoHi, 0.65);
    }
    drawActor(sp, C.indigo, C.indigoHi, won ? 0.95 : 0.65, cell * (won ? 0.85 : 0.32), 1);
    if (anim && anim.fromPlayer && anim.toPlayer) {
      drawTrail(anim.fromPlayer, anim.toPlayer, anim.t, C.coral, C.coralHi, 0.85);
    }
    drawActor(pp, C.coral, C.coralHi, 1, cell * (won ? 0.9 : 0.42), 1);

    drawVignette();
  }

  return { init, render };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Renderer;

</script>
  <script>
/* 双生 · 输入（精装版）
 * 接口（与 GAME_SPEC.md 第 5 节一致，不得变更）：
 *   Input.init(canvas, onStep)
 *   onStep(dir) -> dir ∈ 'up'|'down'|'left'|'right'
 *
 * 支持：
 *   - 触摸滑动：阈值 24px、取主轴方向、抬手（touchend）触发、节流 120ms
 *   - 键盘：方向键 + WASD，preventDefault 阻止页面滚动
 *   - 加分项：滑动方向箭头预览（按下即跟随手指显示箭头，越阈变亮，抬手闪一下）
 *   - 附带：鼠标拖拽（桌面调试等价操作，同样抬手触发）
 */
const Input = (function () {
  'use strict';

  const THRESHOLD = 24;    // 滑动判定阈值（px）
  const THROTTLE = 120;    // 节流间隔（ms）
  const FLASH = 160;       // 抬手后箭头停留时长（ms）

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
  };

  const ARROW_COLOR = '#FF6E5C';
  const ARROW_DIM = 'rgba(232,230,240,0.34)';

  let lastFire = 0;
  let hintEl = null;
  let hintCanvas = null;
  let flashTimer = 0;

  function throttleOk() {
    const now = nowMs();
    if (now - lastFire < THROTTLE) return false;
    lastFire = now;
    return true;
  }

  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }

  /* ---------- 方向箭头预览 ---------- */

  function angleOf(dir) {
    if (dir === 'right') return Math.PI / 2;
    if (dir === 'down') return Math.PI;
    if (dir === 'left') return -Math.PI / 2;
    return 0; // up
  }

  function ensureHint(canvas) {
    if (hintEl) return hintEl;
    const host = (canvas && canvas.parentNode) || document.body;
    hintEl = document.createElement('div');
    hintEl.id = 'swipe-hint';
    hintCanvas = document.createElement('canvas');
    hintCanvas.className = 'sh-arrow';
    hintCanvas.width = 64;
    hintCanvas.height = 64;
    hintEl.appendChild(hintCanvas);
    host.appendChild(hintEl);
    return hintEl;
  }

  function paintArrow(dir, active) {
    if (!hintCanvas) return;
    const g = hintCanvas.getContext('2d');
    g.clearRect(0, 0, 64, 64);
    g.save();
    g.translate(32, 32);
    g.rotate(angleOf(dir));
    g.fillStyle = active ? ARROW_COLOR : ARROW_DIM;
    if (active) { g.shadowColor = ARROW_COLOR; g.shadowBlur = 10; }
    g.beginPath();
    g.moveTo(0, -19);
    g.lineTo(13, 4);
    g.lineTo(5.5, 4);
    g.lineTo(5.5, 18);
    g.lineTo(-5.5, 18);
    g.lineTo(-5.5, 4);
    g.lineTo(-13, 4);
    g.closePath();
    g.fill();
    g.restore();
  }

  function moveHint(canvas, clientX, clientY) {
    const host = (canvas && canvas.parentNode) || document.body;
    const box = host.getBoundingClientRect();
    hintEl.style.left = (clientX - box.left) + 'px';
    hintEl.style.top = (clientY - box.top) + 'px';
  }

  function showHint(canvas, dir, clientX, clientY, active) {
    ensureHint(canvas);
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = 0; }
    paintArrow(dir, active);
    hintEl.classList.toggle('active', !!active);
    hintEl.classList.add('show');
    if (typeof clientX === 'number') moveHint(canvas, clientX, clientY);
    else centerHint(canvas);
  }

  function centerHint(canvas) {
    const host = (canvas && canvas.parentNode) || document.body;
    const box = host.getBoundingClientRect();
    hintEl.style.left = (box.width / 2) + 'px';
    hintEl.style.top = (box.height / 2) + 'px';
  }

  function hideHint(delay) {
    if (!hintEl) return;
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = 0; }
    const off = () => { if (hintEl) { hintEl.classList.remove('show'); hintEl.classList.remove('active'); } };
    if (delay > 0) flashTimer = setTimeout(off, delay);
    else off();
  }

  /* ---------- 初始化 ---------- */

  function init(canvas, onStep) {
    if (!canvas) return;
    ensureHint(canvas);

    const fire = (dir) => {
      if (!throttleOk()) return;
      onStep(dir);
    };

    /* 键盘：方向键 + WASD */
    const onKey = (e) => {
      if (!e || !e.key) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      const dir = KEYMAP[k];
      if (!dir) return;
      e.preventDefault(); // 阻止方向键 / 空格滚动页面
      showHint(canvas, dir, null, null, true);
      hideHint(FLASH);
      fire(dir);
    };
    window.addEventListener('keydown', onKey, { passive: false });

    /* 虚拟方向键（屏幕十字键）：与键盘同一节流、同一方向提示 */
    const dpad = document.getElementById('dpad');
    if (dpad) {
      dpad.querySelectorAll('.dp[data-dir]').forEach((btn) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          showHint(canvas, btn.dataset.dir, null, null, true);
          hideHint(FLASH);
          fire(btn.dataset.dir);
        });
      });
    }

    /* 滑动状态 */
    let id = null;
    let sx = 0, sy = 0, cx = 0, cy = 0;
    let dir = null;
    let armed = false; // 是否已越过阈值

    function dirOf(dx, dy) {
      if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return null;
      return Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? 'right' : 'left')
        : (dy > 0 ? 'down' : 'up');
    }

    function begin(x, y) {
      armed = true;
      sx = cx = x;
      sy = cy = y;
      dir = null;
      showHint(canvas, 'up', x, y, false);
    }

    function move(x, y) {
      if (!armed) return;
      cx = x; cy = y;
      const d = dirOf(x - sx, y - sy);
      if (d) dir = d;
      showHint(canvas, dir || 'up', x, y, !!d);
    }

    function end() {
      if (!armed) return;
      armed = false;
      const d = dir || dirOf(cx - sx, cy - sy);
      if (d) { fire(d); hideHint(FLASH); }
      else hideHint(0);
      dir = null;
    }

    /* 触摸 */
    canvas.addEventListener('touchstart', (e) => {
      if (id !== null) return;
      const t = e.changedTouches[0];
      id = t.identifier;
      begin(t.clientX, t.clientY);
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (id === null) return;
      let t = null;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === id) { t = e.changedTouches[i]; break; }
      }
      if (!t) return;
      e.preventDefault(); // 阻止滑动时页面滚动
      move(t.clientX, t.clientY);
    }, { passive: false });

    const touchEnd = (e) => {
      if (id === null) return;
      let hit = false;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === id) hit = true;
      }
      if (!hit) return;
      id = null;
      end();
    };
    canvas.addEventListener('touchend', touchEnd, { passive: true });
    canvas.addEventListener('touchcancel', () => { id = null; armed = false; hideHint(0); }, { passive: true });

    /* 鼠标拖拽（桌面） */
    canvas.addEventListener('mousedown', (e) => {
      if (id !== null) return;
      id = 'mouse';
      begin(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => {
      if (id !== 'mouse') return;
      move(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', (e) => {
      if (id !== 'mouse') return;
      id = null;
      cx = e.clientX; cy = e.clientY;
      end();
    });

    /* 阻止画布上的长按 / 拖拽默认行为 */
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  return { init };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Input;

</script>
  <script>
/* 双生 · 入口：状态机、动画驱动、HUD、按钮、选关（Claude 负责，CodeBuddy 不得改动接口） */
(function () {
  'use strict';

  let eng = null;
  let curLevel = 0;
  let anim = null; // { t, fromPlayer, toPlayer, fromShadow, toShadow }
  let winShown = false;

  const canvas = document.getElementById('board');
  const elMoves = document.getElementById('move-count');
  const elTime = document.getElementById('time-count');
  const elLevelName = document.getElementById('level-name');
  const elWin = document.getElementById('win-overlay');
  const elWinInfo = document.getElementById('win-info');
  const elWinRecords = document.getElementById('win-records');
  const elLevelSelect = document.getElementById('level-select');
  const elLsButtons = document.getElementById('ls-buttons');
  const elPrivacy = document.getElementById('privacy-overlay');
  const elPrivacyTip = document.getElementById('privacy-decline-tip');

  // 用关卡数量判定版本：100 关 = 地狱版（打包后入口改名 index.html 也依然正确）
  const MODE = (typeof LEVELS !== 'undefined' && LEVELS.length > 20) ? 'hell' : 'normal';
  let startTime = 0; // 本关计时起点（ms，performance.now 基准）
  let finalMs = 0;   // 过关时定格的总用时；0 = 计时中

  Renderer.init(canvas);

  function starsFor(moves, par) {
    if (moves <= par) return 3;
    if (moves <= par * 1.5) return 2;
    return 1;
  }

  function fmtTime(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function bestKey(i) { return 'ss_best_' + MODE + '_' + (i === undefined ? curLevel : i); }

  function bestMs(i) {
    try {
      const v = localStorage.getItem(bestKey(i));
      return v === null ? null : parseInt(v, 10);
    } catch (e) { return null; }
  }

  function saveBest(ms) {
    try { localStorage.setItem(bestKey(), String(Math.floor(ms))); } catch (e) { /* 忽略 */ }
  }

  function updateHUD() {
    elMoves.textContent = eng.moves + '/' + eng.level.par;
    elLevelName.textContent = '第 ' + (curLevel + 1) + ' 关 · ' + eng.level.name;
  }

  function loadLevel(i) {
    curLevel = i;
    eng = new Engine(LEVELS[i]);
    anim = null;
    winShown = false;
    startTime = performance.now();
    finalMs = 0;
    elTime.textContent = '0:00';
    elWin.classList.add('hidden');
    Renderer.init(canvas); // 重新适配网格尺寸
    updateHUD();
  }

  function showWin() {
    const stars = starsFor(eng.moves, eng.level.par);
    const prev = bestMs();
    const won = prev === null || finalMs < prev;
    if (won) saveBest(finalMs);
    elWinInfo.textContent = '用时 ' + eng.moves + ' 步 · ' + fmtTime(finalMs) + ' · ' + '★'.repeat(stars) + '☆'.repeat(3 - stars);
    elWinRecords.textContent = '最短 ' + eng.level.par + ' 步 · 最快 ' + fmtTime(won ? finalMs : prev)
      + (prev === null ? '（首次纪录）' : won ? '（新纪录！）' : '');
    elWin.classList.remove('hidden');
  }

  function onStep(dir) {
    if (!eng || anim || winShown) return;
    const res = eng.tryMove(dir);
    if (res.ok) {
      anim = {
        t: 0,
        fromPlayer: eng.history[eng.history.length - 1][0],
        toPlayer: { r: eng.player.r, c: eng.player.c },
        fromShadow: eng.history[eng.history.length - 1][1],
        toShadow: { r: eng.shadow.r, c: eng.shadow.c },
      };
      updateHUD();
      if (res.won) {
        finalMs = performance.now() - startTime;
        winShown = true;
        setTimeout(showWin, 320);
      }
    }
  }

  function frame() {
    if (anim) {
      anim.t += 0.16; // ~6 帧完成一步
      if (anim.t >= 1) anim = null;
    }
    if (eng && finalMs === 0) {
      const t = fmtTime(performance.now() - startTime);
      if (elTime.textContent !== t) elTime.textContent = t;
    }
    if (eng) {
      Renderer.render({
        player: eng.player,
        shadow: eng.shadow,
        moves: eng.moves,
        won: eng.won,
        level: eng.level,
        goalShadowPos: eng.goalShadow,
      }, anim);
    }
    requestAnimationFrame(frame);
  }

  // 按钮
  document.getElementById('btn-undo').addEventListener('click', () => {
    if (!eng || anim || winShown) return;
    if (eng.undo()) updateHUD();
  });
  document.getElementById('btn-reset').addEventListener('click', () => loadLevel(curLevel));
  document.getElementById('btn-next').addEventListener('click', () => {
    loadLevel((curLevel + 1) % LEVELS.length);
  });
  document.getElementById('btn-replay').addEventListener('click', () => loadLevel(curLevel));
  document.getElementById('btn-levels').addEventListener('click', () => {
    buildLevelSelect(); // 刷新各关纪录
    elLevelSelect.classList.remove('hidden');
  });
  document.getElementById('btn-ls-close').addEventListener('click', () => {
    elLevelSelect.classList.add('hidden');
  });

  // 选关面板
  function buildLevelSelect() {
    elLsButtons.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const b = document.createElement('button');
      const best = bestMs(i);
      b.innerHTML = '<span>' + (i + 1) + '. ' + lv.name + '</span>'
        + '<span class="ls-meta">最短 ' + lv.par + ' 步 · 最快 ' + (best === null ? '--' : fmtTime(best)) + '</span>';
      b.addEventListener('click', () => {
        elLevelSelect.classList.add('hidden');
        loadLevel(i);
      });
      elLsButtons.appendChild(b);
    });
  }

  /* ---------- 启动门槛：隐私政策同意（TapTap 合规要求） ---------- */
  let started = false;

  function startGame() {
    if (started) return;
    started = true;
    buildLevelSelect();
    loadLevel(0);
    Input.init(canvas, onStep);
    requestAnimationFrame(frame);
  }

  try {
    if (localStorage.getItem('ss_privacy_ok')) {
      elPrivacy.classList.add('hidden');
      startGame();
    }
  } catch (e) { /* localStorage 不可用时仍显示门槛 */ }

  document.getElementById('btn-privacy-agree').addEventListener('click', () => {
    try { localStorage.setItem('ss_privacy_ok', '1'); } catch (e) { /* 忽略 */ }
    elPrivacy.classList.add('hidden');
    startGame();
  });
  document.getElementById('btn-privacy-decline').addEventListener('click', () => {
    elPrivacyTip.classList.remove('hidden');
  });
})();

</script>
